<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Phoe Wa Lone</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
		.footer-note {
		    text-align: center;
		    margin-top: 50px;
		    font-size: 14px;
		    color: #888888;
		}
        /* --- Dynamic Logo Header & Brand Group Styling --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-badge {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 6px rgba(110, 72, 196, 0.3));
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            text-decoration: none;
            line-height: 1;
            margin: 0;
        }
    </style>
      <link rel="stylesheet" href="css/shared-navbar.css">
</head>
<body>

    <header class="course-navbar">
  <a class="nav-brand" href="index.html" aria-label="Phoe Wa Lone home">
    <img class="brand-logo" src="images/Logo.jpg" alt="Phoe Wa Lone logo">
    <span>Phoe Wa Lone</span>
  </a>
  <div class="nav-right-wrapper">
    <nav class="course-nav course-nav-links" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="courses.html">Courses</a>

      <a class="btn-nav-login" href="login.html">Log in</a>
      <a class="btn-nav-signup active-auth" href="signup.html">Sign up</a>
      <button class="btn-mm-pill" type="button" onclick="window.location.href='signupmm.html'">MM</button>
   
    </nav>
  </div>
</header>

    <main class="main-container">
        
        <div class="auth-side">
            <div class="auth-card">
                <h2>Sign Up</h2>
                <div class="tagline">Create an account to track your learning progress</div>

                <div class="status-msg error" id="errorDiv"></div>
                <div class="status-msg success" id="successDiv"></div>

                <form id="signupForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" required placeholder="Choose a username">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required placeholder="Enter your Email">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required placeholder="Create a password">
                    </div>
                    
                    <button type="submit" class="btn-primary" style="margin-top: 10px;">SignUp</button>
                </form>

                <div class="divider">OR</div>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Log In</a>
                </div>
            </div>
        </div>

        <div class="showcase-side">
            <div class="alphabet-image-card">
                <img src="images/image2.jpg" alt="Myanmar Alphabet Chart">
            </div>
        </div>

    </main>

    <script>
    document.getElementById('signupForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const userVal = document.getElementById('username').value.trim();
        const emailVal = document.getElementById('email').value.trim();
        const passVal = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorDiv');
        const successDiv = document.getElementById('successDiv');

        errorDiv.style.display = "none";
        successDiv.style.display = "none";

        // Regex pattern for strict valid email format checking
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailVal)) {
            errorDiv.style.display = "block";
            errorDiv.innerText = "Please enter a valid email address format (e.g., name@example.com).";
            return;
        }

        fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                username: userVal, 
                email: emailVal,
                password: passVal 
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "SUCCESS") {
                successDiv.style.display = "block";
                successDiv.innerText = data.message + " Redirecting to login...";
                setTimeout(() => { window.location.href = "login.html"; }, 2000);
            } else {
                errorDiv.style.display = "block";
                errorDiv.innerText = data.message;
            }
        })
        .catch(err => {
            errorDiv.style.display = "block";
            errorDiv.innerText = "Error connecting to backend services.";
        });
    });
    </script>
	
    <!-- Dynamic Logo Generator Script -->
    <script src="js/logo.js"></script>
	<footer class="footer-note">© 2026 Phoe Wa Lone. Learn Burmese with confidence.</footer>
</body>
</html>
