<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Level 1 Master Quiz | Phoe Wa Lone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Padauk', 'Baloo 2', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      overflow-x: hidden;
    }
    
    /* Floating Emojis Background */
    .emoji-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-emoji {
      position: absolute;
      font-size: 2rem;
      user-select: none;
      animation: floatAndRotate 12s infinite ease-in-out;
      opacity: 0.7;
    }

    @keyframes floatAndRotate {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.8);
      }
      50% {
        transform: translateY(50vh) rotate(180deg) scale(1.2);
      }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(0.8);
      }
    }

    .quiz-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }

    .option-btn {
      transition: all 0.2s ease-in-out;
    }

    .option-btn:hover {
      transform: translateY(-2px);
    }

    .option-btn.selected {
      border-color: #3b82f6;
      background-color: #eff6ff;
    }

    .option-btn.correct {
      border-color: #22c55e;
      background-color: #f0fdf4;
      color: #15803d;
    }

    .option-btn.incorrect {
      border-color: #ef4444;
      background-color: #fef2f2;
      color: #b91c1c;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

  <!-- Floating Emojis Background -->
  <div class="emoji-bg" id="emojiBg"></div>

  <!-- Header -->
  <header class="relative z-10 w-full bg-white/80 backdrop-blur-md border-b border-sky-100 py-4 px-6 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-3">
      <span class="text-3xl">⭐</span>
      <div>
        <h1 class="font-bold text-xl text-sky-800 leading-none">ဖိုးဝလုံး</h1>

    </div>
    <div class="bg-sky-100 text-sky-800 font-bold px-4 py-1.5 rounded-full text-sm">

  </header>

  <!-- Main Container -->
  <main class="relative z-10 container mx-auto px-4 py-8 max-w-2xl flex-grow flex flex-col justify-center">

    <!-- Progress Bar -->
    <div class="w-full bg-slate-200 h-3 rounded-full mb-6 overflow-hidden shadow-inner">
      <div id="progressBar" class="bg-gradient-to-r from-sky-400 to-blue-600 h-full w-0 transition-all duration-300"></div>
    </div>

    <!-- Quiz Box -->
    <div id="quizContainer" class="quiz-card rounded-3xl p-6 md:p-8 border border-white">
      <!-- Question Section -->
      <div id="questionBox">
        <div class="flex items-center gap-2 mb-2">
          <span id="badgeCategory" class="text-xs font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">
            သင်ခန်းစာ ၁
          </span>
        </div>
        <h2 id="questionText" class="text-xl md:text-2xl font-bold text-slate-800 mb-6 leading-relaxed">
          မေးခွန်းရယူနေသည်...
        </h2>

        <!-- Options Grid -->
        <div id="optionsGrid" class="grid grid-cols-1 gap-3.5 mb-6"></div>

        <!-- Explanation Box -->
        <div id="explanationBox" class="hidden p-4 rounded-2xl mb-6 text-sm leading-relaxed"></div>

        <!-- Action Footer -->
        <div class="flex justify-between items-center pt-2">
          <button id="hintBtn" class="text-amber-600 bg-amber-50 hover:bg-amber-100 font-semibold text-sm px-4 py-2 rounded-xl border border-amber-200 transition-colors flex items-center gap-1.5">
            💡 <span>အကူအညီကြည့်မည်</span>
          </button>
          <button id="nextBtn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl transition-transform active:scale-95 shadow-lg shadow-blue-500/30">
            နောက်မေးခွန်း →
          </button>
        </div>
        
        <!-- Hint Display -->
        <div id="hintText" class="hidden mt-3 text-xs text-amber-800 bg-amber-50/80 p-3 rounded-xl border border-amber-200"></div>
      </div>

      <!-- Results View -->
      <div id="resultsBox" class="hidden text-center py-6">
        <div class="text-6xl mb-4" id="resultEmoji">🎉</div>
        <h2 class="text-3xl font-extrabold text-slate-800 mb-2">ဖြေဆိုပြီးပါပြီ။</h2>
        <p class="text-slate-600 mb-6">Level 1 ဖြေဆိုမှု ရလဒ်များ -</p>
        
        <div class="bg-sky-50 rounded-2xl p-6 border border-sky-100 mb-6 max-w-sm mx-auto">
          <div class="text-5xl font-black text-sky-600 mb-1" id="scoreDisplay">၀ / ၁၀</div>
          <p id="scoreMessage" class="text-sky-800 font-semibold text-sm mt-2">တော်တော်လေး ကြိုးစားထားတာပဲ။</p>
        </div>

        <button onclick="restartQuiz()" class="bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg hover:brightness-110 transition-all active:scale-95">
          🔄 ပြန်လည်ဖြေဆိုမည်
        </button>
		<button onclick="" class="bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg hover:brightness-110 transition-all active:scale-95">
		          
		        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 text-center py-4 text-xs font-semibold text-slate-500">
    ဖိုးဝလုံး · Level 1 သင်ယူမှုအတွေ့အကြုံ

  <script>
    const emojis = ['🎈', '🐰', '✏️', '🐘', '🦋', '🐝', '📖', '⭐', '✨', '🌙', '🐟', '🐉', '🏆', '💡'];
    const emojiBg = document.getElementById('emojiBg');

    function createFloatingEmojis() {
      const count = 18;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'floating-emoji';
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = `${Math.random() * 95}%`;
        el.style.animationDuration = `${7 + Math.random() * 10}s`;
        el.style.animationDelay = `${Math.random() * 5}s`;
        emojiBg.appendChild(el);
      }
    }

    const toBurmeseDigits = (num) => {
      const myanNums = ['၀', '၁', '၂', '၃', '၄', '၅', '၆', '၇', '၈', '၉'];
      return num.toString().split('').map(d => myanNums[parseInt(d)] || d).join('');
    };

        question: "\"တစ်ချောင်းငင်\" ဟု ခေါ်ပြီး အသံတို \"အု\" အသံထွက်စေသော သင်္ကေတမှာ မည်သည့်အရာနည်း။",
        options: [
          { text: "ု", isCorrect: true, rationale: "တစ်ချောင်းငင် (ု) ကို ဗျည်း၏ အောက်တွင် ရေးသားပြီး \"အု\" အသံထွက်စေပါသည်။" },
          { text: "ူ", isCorrect: false, rationale: "နှစ်ချောင်းငင် (ူ) သည် \"အူး\" အသံထွက်ပါသည်။" },
          { text: "ဲ", isCorrect: false, rationale: "နောက်ပစ် (ဲ) သည် \"အဲ\" အသံထွက်ပါသည်။" },
          { text: "့", isCorrect: false, rationale: "အောက်မြစ် (့) သည် အသံကို ပိုမိုတိုတောင်းစေပါသည်။" }
        ],
        hint: "အောက်သို့ ဆွဲချထားသော မျဉ်းတစ်ချောင်း ပါဝင်ပါသည်။"
      },
      {
        course: "သင်ခန်းစာ ၅",
        question: "ဗျည်း၏ အောက်တွင် ရေးသားရပြီး အသံထွက်ကို တိုတောင်းဆွဲဆိုင်းစေသော သင်္ကေတမှာ မည်သည့်အရာနည်း။",
        options: [
          { text: "့ (အောက်မြစ်)", isCorrect: true, rationale: "အောက်မြစ် (့) သည် စာလုံးအောက်တွင် အစက်ကလေးအဖြစ် တည်ရှိပြီး အသံထွက်ကို မြှင့်/တိုစေပါသည်။" },
          { text: "း (ဝစ္စနှစ်လုံးပေါက်)", isCorrect: false, rationale: "ဝစ္စနှစ်လုံးပေါက် (း) ကို စာလုံးအနောက်တွင် ဘေးချင်းယှဉ် အစက်နှစ်စက်အဖြစ် ရေးပါသည်။" },
          { text: "ဲ (နောက်ပစ်)", isCorrect: false, rationale: "နောက်ပစ် (ဲ) ကို ဗျည်း၏ အပေါ်/အနောက်တွင် ရေးပါသည်။" },
          { text: "ု (တစ်ချောင်းငင်)", isCorrect: false, rationale: "တစ်ချောင်းငင် (ု) သည် \"အု\" သရသံကို ထွက်စေပါသည်။" }
        ],
        hint: "စာလုံးအောက်တွင် အစက်တစ်စက်အဖြစ် ရှိနေပါသည်။"
      },
      {
        course: "သင်ခန်းစာ ၅",
        question: "\"အဲ\" သရသံ ဖြစ်ပေါ်စေရန် ဗျည်း၏ အနောက်/အပေါ်တွင် ရေးရသော သင်္ကေတမှာ မည်သည့်အရာနည်း။",
        options: [
          { text: "ဲ (နောက်ပစ်)", isCorrect: true, rationale: "နောက်ပစ် (ဲ) ကို ဗျည်းအနောက်အပေါ်တွင် ရေးသား၍ \"အဲ\" သရသံ ဖြစ်ပေါ်စေပါသည်။" },
          { text: "ူ (နှစ်ချောင်းငင်)", isCorrect: false, rationale: "နှစ်ချောင်းငင် (ူ) သည် \"အူး\" အသံထွက်ပါသည်။" },
          { text: "ု (တစ်ချောင်းငင်)", isCorrect: false, rationale: "တစ်ချောင်းငင် (ု) သည် \"အု\" အသံထွက်ပါသည်။" },
          { text: "ိ (လုံးကြီးတင်)", isCorrect: false, rationale: "လုံးကြီးတင် (ိ) သည် \"အိ\" အသံထွက်ပါသည်။" }
        ],
        hint: "ဗျည်း၏ ညာဘက်အပေါ်ထောင့်တွင် ချိတ်ဆွဲထားသော သင်္ကေတဖြစ်ပါသည်။"
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;
    let shuffledQuiz = [];

    function initQuiz() {
      createFloatingEmojis();
      shuffledQuiz = [...quizData].sort(() => Math.random() - 0.5);
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q = shuffledQuiz[currentIdx];

      document.getElementById('currentQ').innerText = toBurmeseDigits(currentIdx + 1);
      document.getElementById('totalQ').innerText = toBurmeseDigits(shuffledQuiz.length);
      document.getElementById('badgeCategory').innerText = q.course;
      document.getElementById('questionText').innerText = q.question;
      
      const percent = ((currentIdx) / shuffledQuiz.length) * 100;
      document.getElementById('progressBar').style.width = `${percent}%`;

      document.getElementById('explanationBox').className = "hidden p-4 rounded-2xl mb-6 text-sm leading-relaxed";
      document.getElementById('hintBtn').classList.remove('hidden');
      document.getElementById('hintText').classList.add('hidden');
      document.getElementById('nextBtn').classList.add('hidden');

      const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      shuffledOptions.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn w-full text-left p-4 rounded-2xl border-2 border-slate-200 bg-white font-semibold text-slate-700 hover:border-sky-300 shadow-sm flex justify-between items-center';
        btn.innerHTML = `<span>${opt.text}</span> <span class="status-icon"></span>`;
        btn.onclick = () => selectOption(btn, opt, q);
        grid.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, option, question) {
      if (answered) return;
      answered = true;

      const grid = document.getElementById('optionsGrid');
      const buttons = grid.querySelectorAll('.option-btn');

      if (option.isCorrect) {
        score++;
        selectedBtn.classList.add('correct');
        selectedBtn.querySelector('.status-icon').innerText = '✅';
        showExplanation(true, option.rationale);
      } else {
        selectedBtn.classList.add('incorrect');
        selectedBtn.querySelector('.status-icon').innerText = '❌';

        buttons.forEach(btn => {
          if (btn.innerText.includes(question.options.find(o => o.isCorrect).text)) {
            btn.classList.add('correct');
            btn.querySelector('.status-icon').innerText = '✅';
          }
        });

        showExplanation(false, option.rationale);
      }

      buttons.forEach(b => b.style.pointerEvents = 'none');
      document.getElementById('nextBtn').classList.remove('hidden');
    }

    function showExplanation(isCorrect, rationale) {
      const box = document.getElementById('explanationBox');
      box.classList.remove('hidden');
      if (isCorrect) {
        box.className = "p-4 rounded-2xl mb-6 text-sm leading-relaxed bg-green-50 border border-green-200 text-green-900";
        box.innerHTML = `<strong>🌟 အဖြေမှန်ပါသည်။</strong> ${rationale}`;
      } else {
        box.className = "p-4 rounded-2xl mb-6 text-sm leading-relaxed bg-amber-50 border border-amber-200 text-amber-900";
        box.innerHTML = `<strong>💡 ရှင်းလင်းချက် -</strong> ${rationale}`;
      }
    }

    document.getElementById('hintBtn').onclick = () => {
      const hintText = document.getElementById('hintText');
      hintText.innerText = shuffledQuiz[currentIdx].hint;
      hintText.classList.toggle('hidden');
    };

    document.getElementById('nextBtn').onclick = () => {
      currentIdx++;
      if (currentIdx < shuffledQuiz.length) {
        renderQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      document.getElementById('questionBox').classList.add('hidden');
      document.getElementById('resultsBox').classList.remove('hidden');
      document.getElementById('progressBar').style.width = '100%';

      const scoreDisplay = document.getElementById('scoreDisplay');
      const scoreMessage = document.getElementById('scoreMessage');
      const resultEmoji = document.getElementById('resultEmoji');

      scoreDisplay.innerText = `${toBurmeseDigits(score)} / ${toBurmeseDigits(shuffledQuiz.length)}`;

      if (score >= 8) {
        resultEmoji.innerText = "🌟🏆🎉";
        scoreMessage.innerText = "ဂုဏ်ယူပါတယ်။ Level 1 ကို ကျွမ်းကျင်စွာ တတ်မြောက်သွားပါပြီ။";
      } else if (score >= 5) {
        resultEmoji.innerText = "👍🎈✨";
        scoreMessage.innerText = "တော်တော်လေး ကောင်းပါတယ်။ ၁၀/၁၀ ရအောင် ဆက်လက် ကြိုးစားကြည့်ပါ။";
      } else {
        resultEmoji.innerText = "📚💪🐰";
        scoreMessage.innerText = "ကြိုးစားမှု ကောင်းပါတယ်။ သင်ခန်းစာ ၁-၅ ကို ပြန်နွှေးပြီး ထပ်မံဖြေဆိုကြည့်ပါ။";
      }
    }

    function restartQuiz() {
      currentIdx = 0;
      score = 0;
      shuffledQuiz = [...quizData].sort(() => Math.random() - 0.5);
      document.getElementById('resultsBox').classList.add('hidden');
      document.getElementById('questionBox').classList.remove('hidden');
      renderQuestion();
    }

    window.onload = initQuiz;
  </script>
</body>
