<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အကောင့်ဝင်ရန် - ဖိုးဝလုံး (Phoe Wa Lone)</title>
    <!-- Linked to your exact CSS structure -->
    <link rel="stylesheet" href="css/style.css">
    <style>
		.footer-note {
		    text-align: center;
		    margin-top: 50px;
		    font-size: 14px;
		    color: #888888;
		}
        /* Header & Brand Logo Styling */
        .brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-badge {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 6px rgba(110, 72, 196, 0.3));
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            color: #111111;
            text-decoration: none;
            line-height: 1;
            margin: 0;
        }

        /* Password container & eye icon styling */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 40px; /* Space for the eye icon */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777777;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }
    </style>
    <link rel="stylesheet" href="css/shared-navbar.css">
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="course-navbar">
        <a class="nav-brand" href="index.html" aria-label="Phoe Wa Lone home">
            <img class="brand-logo" src="images/Logo.jpg" alt="ဖိုးဝလုံ လိုဂို">
            <span>ဖိုးဝလုံး</span>
        </a>
        <div class="nav-right-wrapper">
            <nav class="course-nav course-nav-links" aria-label="Main navigation">
                <a href="index.html">ပင်မစာမျက်နှာ</a>
                <a href="about.html">အကြောင်းအရာ</a>
                <a href="courses.html">သင်တန်းများ</a>
                <a class="btn-nav-login active-auth" href="loginmm.html">အကောင့်ဝင်ရန်</a>
                <a class="btn-nav-signup" href="signup.html">အကောင့်ဖွင့်ရန်</a>
                <button class="btn-mm-pill" type="button" onclick="window.location.href='login.html'">EN</button>
            </nav>
        </div>
    </header>

    <!-- Split Main Container -->
    <main class="main-container">
        
        <!-- Left Side: Auth Card Container -->
        <div class="auth-side">
            <div class="auth-card">
                
                <h2>အကောင့်ဝင်ရန်</h2>
                <p class="tagline">သင်ခန်းစာများကို ကြည့်ရှုပြီး တိုးတက်မှုကို ခြေရာခံပါ</p>

                <!-- Status Notifications -->
                <div id="error-message" class="status-msg error"></div>
                <div id="success-message" class="status-msg success"></div>

                <!-- Input Fields Form Sheet -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="usernameInput">အသုံးပြုသူအမည် (သို့) အီးမေးလ်</label>
                        <input type="text" id="usernameInput" placeholder="သင်၏ အသုံးပြုသူအမည် သို့မဟုတ် အီးမေးလ်ကို ထည့်ပါ" required>
                    </div>

                    <div class="form-group">
                        <label for="passwordInput">စကားဝှက် (Password)</label>
                        <div class="password-wrapper">
                            <input type="password" id="passwordInput" placeholder="သင်၏ စကားဝှက်ကို ထည့်ပါ" required>
                            <button type="button" class="toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                                <!-- Eye Icon (Default: Closed/Hide) -->
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="forgot-link">
                        <a href="forgotpass.html">စကားဝှက် မေ့နေပါသလား?</a>
                    </div>

                    <button type="submit" class="btn-primary">အကောင့်ဝင်မည်</button>
                </form>

                <!-- OR Divider Line -->
                <div class="divider">သို့မဟုတ်</div>

                <!-- Bottom Footer Redirection Links -->
                <p class="auth-footer">
                    အကောင့်မရှိသေးဘူးလား? <a href="signup.html">အကောင့်ဖွင့်ရန်</a>
                </p>
            </div>
        </div>

        <!-- Right Side: Image Showcase Container Layout -->
        <div class="showcase-side">
            <div class="alphabet-image-card">
                <!-- Points directly to your Burmese letters graphic asset -->
                <img src="images/image2.jpg" alt="မြန်မာအက္ခရာ ပုံဖော်ပြချက်">
            </div>
        </div>

    </main>

    <!-- JavaScript Authorization Engine Router Fetch Controller Logic with Role Redirection -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("passwordInput");
            const eyeIcon = document.getElementById("eyeIcon");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                // Change to Eye Open Icon
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            } else {
                passwordInput.type = "password";
                // Change back to Eye Closed Icon
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            }
        }

        function handleLogin(event) {
            event.preventDefault();

            const identity = document.getElementById("usernameInput").value.trim();
            const password = document.getElementById("passwordInput").value;
            
            const errorDiv = document.getElementById("error-message");
            const successDiv = document.getElementById("success-message");

            // Reset visibility states using class defaults
            errorDiv.style.display = "none";
            successDiv.style.display = "none";

            // Check if password length is at least 8 characters
            if (password.length < 8) {
                errorDiv.style.display = "block";
                errorDiv.innerText = "စကားဝှက်သည် အနည်းဆုံး ၈ လုံး ရှိရပါမည်။";
                return;
            }

            fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: identity, 
                    password: password
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Network issues encountered calling backend operations mapping router handlers.");
                }
                return response.json();
            })
            .then(data => {
                if (data.status === "SUCCESS") {
                    successDiv.style.display = "block";
                    successDiv.innerText = "အကောင့်ဝင်ခြင်း အောင်မြင်ပါသည်။ စာမျက်နှာသို့ ပို့ဆောင်နေပါသည်...";

                    // Save session data to localStorage
                    localStorage.setItem("loggedInUser", data.message || identity);
                    localStorage.setItem("userRole", data.role);

                    setTimeout(() => {
                        // Role-based redirection logic
                        if (data.role === "ADMIN") {
                            window.location.href = "admindashboard.html"; // Routes to Admin Dashboard
                        } else {
                            window.location.href = "dashboard.html"; // Routes to Student Dashboard
                        }
                    }, 1200);
                } else {
                    errorDiv.style.display = "block";
                    errorDiv.innerText = data.message;
                }
            })
            .catch(err => {
                console.error("Login Interface Operations System Fault Trace Context:", err);
                errorDiv.style.display = "block";
                errorDiv.innerText = "ဆာဗာသို့ ချိတ်ဆက်၍မရပါ။ Spring Boot အက်ပ် ပွင့်နေခြင်း ရှိမရှိ စစ်ဆေးပါ။";
            });
        }
    </script>

    <!-- Scripts -->
    <script src="js/logo.js"></script>
   
    <footer class="footer-note">© 2026 ဖိုးဝလုံ။ ယုံကြည်မှုရှိရှိဖြင့် မြန်မာစာကို လေ့လာပါ။</footer>
</body>
</html>
